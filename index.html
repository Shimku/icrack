<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0; background: #f2f2f4; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  body.bleed { background: #0d0e2b; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  p, h1, h2 { margin: 0; }
  .hidden { display: none !important; }
  button {
    font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    border-radius: 999px; border: 1px solid rgba(255, 255, 255, .32); background: rgba(255, 255, 255, .12);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  button.solid { background: #fff; color: #111; border-color: #fff; }

  /* home screen */
  #apps { position: fixed; display: grid; justify-items: center; align-content: center; row-gap: 14px; }
  .app { background: none; border: 0; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: 18px; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .app img { width: var(--icon); height: var(--icon); border-radius: 22.5%; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); display: block; }
  .app span { font-size: clamp(10.5px, calc(var(--icon) * .19), 13.5px); font-weight: 500; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .app:active img { filter: brightness(.75); transform: scale(.96); }
  #brand {
    --k: 1; position: fixed; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; gap: calc(var(--k) * 6px); padding: 10px 16px; pointer-events: none;
    text-shadow: 0 1px 14px rgba(0, 0, 0, .35);
  }
  .logo {
    position: relative; font-size: calc(var(--k) * 46px); font-weight: 700; letter-spacing: -.035em; line-height: 1;
    margin-bottom: calc(var(--k) * 4px);
  }
  /* the defect, under the logo */
  .logo::after, .logo::before {
    content: ""; position: absolute; background: #f2fff6;
    box-shadow: 0 0 0 .012em #28ff8c, 0 0 .2em #28ff8c;
  }
  .logo::after { left: 47%; right: -9%; top: 96%; height: max(2px, .045em); }
  .logo::before { left: 47%; top: 96%; height: .3em; width: max(1.5px, .032em); }
  #brand .tag { font-size: calc(var(--k) * 15px); font-weight: 600; }
  #b-install { pointer-events: auto; font-size: calc(var(--k) * 13px); padding: .5em 1.15em; margin-top: calc(var(--k) * 8px); }

  /* panels */
  #panel {
    --k: 1; position: fixed; display: flex; align-items: center; justify-content: center; padding: 10px;
    pointer-events: none;
  }
  .card {
    pointer-events: none; display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: calc(var(--k) * 7px); padding: calc(var(--k) * 18px) calc(var(--k) * 22px); max-width: 100%;
    border-radius: calc(var(--k) * 24px); background: rgba(16, 14, 38, .5);
    border: 1px solid rgba(255, 255, 255, .1);
    -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
    text-shadow: 0 1px 10px rgba(0, 0, 0, .3);
  }
  .card { position: relative; }
  .card button, .card .link { pointer-events: auto; font-size: calc(var(--k) * 13.5px); padding: calc(var(--k) * 8px) calc(var(--k) * 15px); }
  .card .link {
    font-weight: 600; color: #fff; text-decoration: none; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .32); background: rgba(255, 255, 255, .12);
  }
  .card .link:active { background: rgba(255, 255, 255, .22); }
  .card .link.x {
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
    width: calc(var(--k) * 34px); height: calc(var(--k) * 34px);
  }
  .card .link.x svg { width: calc(var(--k) * 14px); height: calc(var(--k) * 14px); display: block; }
  .card button.info {
    position: absolute; top: calc(var(--k) * 12px); right: calc(var(--k) * 12px);
    width: calc(var(--k) * 26px); height: calc(var(--k) * 26px); padding: 0;
    font: italic 700 calc(var(--k) * 15px) / 1 Georgia, "Times New Roman", serif;
  }
  .card .steps {
    list-style: none; margin: calc(var(--k) * 2px) 0; padding: 0; text-align: left;
    display: flex; flex-direction: column; gap: calc(var(--k) * 8px); font-size: calc(var(--k) * 15px); font-weight: 600;
  }
  .card .steps li { display: flex; align-items: center; gap: .4em; }
  .card .steps .n {
    width: 1.55em; height: 1.55em; border-radius: 50%; background: rgba(255, 255, 255, .18);
    display: inline-flex; align-items: center; justify-content: center; font-size: .8em; margin-right: .25em;
  }
  .card .glyph { width: 1.15em; height: 1.15em; display: inline-block; color: #4da3ff; }
  .card .note { font-size: calc(var(--k) * 15px); font-weight: 600; max-width: 22em; line-height: 1.35; }
  .card h2 { font-size: calc(var(--k) * 28px); font-weight: 700; letter-spacing: -.02em; }
  .card .how { font-size: calc(var(--k) * 14px); opacity: .85; max-width: 24em; line-height: 1.35; }
  .card .cta { font-size: calc(var(--k) * 15px); font-weight: 600; animation: pulse 1.6s ease-in-out infinite; }
  .card .sub { font-size: calc(var(--k) * 13px); opacity: .72; font-variant-numeric: tabular-nums; }
  .card .why { font-size: calc(var(--k) * 17px); font-weight: 600; max-width: 22em; }
  .card .big { font-size: calc(var(--k) * 44px); font-weight: 700; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .card .big small { font-size: .42em; font-weight: 600; opacity: .75; letter-spacing: 0; }
  .card .fine { font-size: calc(var(--k) * 10.5px); opacity: .6; max-width: 30em; line-height: 1.35; }
  .card .legal { font-size: calc(var(--k) * 9.5px); opacity: .45; max-width: 36em; line-height: 1.35; margin-top: calc(var(--k) * 2px); }
  .row { display: flex; gap: calc(var(--k) * 8px); flex-wrap: wrap; justify-content: center; margin-top: calc(var(--k) * 3px); }
  .tight .fine, .tight .how { display: none; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* in-game */
  #hud { --hs: 16px; position: fixed; display: flex; align-items: center; gap: 10px; pointer-events: none; }
  #hud .pill { pointer-events: auto; font-size: calc(var(--hs) * .8); padding: .3em .85em; }
  .hud-text { display: flex; align-items: baseline; gap: 8px; text-shadow: 0 1px 10px rgba(0, 0, 0, .45); }
  #hud.dark .hud-text { color: #1c1408; text-shadow: 0 1px 8px rgba(255, 255, 255, .55); }
  #hud.dark .pill { color: #1c1408; border-color: rgba(0, 0, 0, .28); background: rgba(255, 255, 255, .35); }
  .card button.on { background: #fff; color: #111; border-color: #fff; }
  #hud-main { font-size: var(--hs); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  #hud-sub { font-size: calc(var(--hs) * .72); font-weight: 600; opacity: .7; font-variant-numeric: tabular-nums; }
  body[data-state="title"] .hud-text { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="hub">
  <div id="apps"></div>
  <div id="brand">
    <h1 class="logo">iCrack</h1>
    <p class="tag">Make some use of the Green Line of Death.</p>
    <button id="b-install" class="hidden">Add to Home Screen</button>
  </div>
</div>
<div id="hud" class="hidden"><button id="b-home" class="pill">Home</button><div class="hud-text"><span id="hud-main"></span><span id="hud-sub"></span></div></div>
<div id="panel" class="hidden"><div class="card" id="card"></div></div>
<!-- home screen order -->
<script src="js/core.js?v=11"></script>
<script src="js/blocks.js?v=11"></script>
<script src="js/walk.js?v=11"></script>
<script src="js/hangman.js?v=11"></script>
<script src="js/pinball.js?v=11"></script>
<script src="js/metro.js?v=11"></script>
<script src="js/buzz.js?v=11"></script>
<script>IC.boot();</script>
</body>
</html>
